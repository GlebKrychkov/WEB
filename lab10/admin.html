<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pages</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header_row row">
                <div class="header_logo col-lg-3">
                    <a href="index.html"><img src="logo.png" alt="Pages Logo"></a>
                </div>
                <div class="header_menu col-lg-6">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="catalog.html">Catalog</a></li>
                        <li><a href="cart.html">Cart</a></li>
                        <li><a href="register.html">Register/Login</a></li>
                        <li><a href="feedback.html">Feedback</a></li>
                        <li class="admin-link" style="display: none;"><a href="admin.html">Admin</a></li>
                    </ul>
                </div>
                <div class="header_iconBox col-lg-3">
                    <a href="#"><i class="fas fa-search"></i></a>
                    <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
                    <a href="register.html"><i class="fas fa-user"></i></a>
                </div>
            </div>
        </div>
    </header>

    <main class="admin">
        <div class="container">
            <h2 class="title text-center">Admin Panel</h2>

            <section class="mt-5">
                <h3 class="title title-sm">Manage Books</h3>
                <form id="book-form">
                    <input type="hidden" id="book-id">
                    <div class="mb-3">
                        <label for="book-title" class="required">Title *</label>
                        <input type="text" id="book-title" class="form-control" required>
                        <span class="error"></span>
                    </div>
                    <div class="mb-3">
                        <label for="book-author" class="required">Author *</label>
                        <input type="text" id="book-author" class="form-control" required>
                        <span class="error"></span>
                    </div>
                    <div class="mb-3">
                        <label for="book-price" class="required">Price *</label>
                        <input type="number" id="book-price" class="form-control" step="0.01" required>
                        <span class="error"></span>
                    </div>
                    <div class="mb-3">
                        <label for="book-category" class="required">Category *</label>
                        <select id="book-category" class="form-control" required>
                            <option value="">Select a category</option>
                            <option value="Fiction">Fiction</option>
                            <option value="Non-Fiction">Non-Fiction</option>
                            <option value="Science">Science</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Mystery">Mystery</option>
                            <option value="History">History</option>
                        </select>
                        <span class="error"></span>
                    </div>
                    <div class="mb-3">
                        <label for="book-description" class="required">Description *</label>
                        <textarea id="book-description" class="form-control" required></textarea>
                        <span class="error"></span>
                    </div>
                    <div class="mb-3">
                        <label for="book-image" class="required">Image *</label>
                        <input type="text" id="book-image" class="form-control" placeholder="image.jpg" required>
                        <span class="error"></span>
                    </div>
                    <div class="mb-3">
                        <label for="book-rating" class="required">Rating *</label>
                        <input type="number" id="book-rating" class="form-control" step="0.1" min="0" max="5" required>
                        <span class="error"></span>
                    </div>
                    <button type="submit" id="submit-book" class="button" disabled>Add Book</button>
                    <button type="button" id="cancel-edit" class="button" style="display: none;">Cancel</button>
                </form>
            </section>

            <section class="mt-5">
                <h3 class="title title-sm">Book List</h3>
                <div id="book-list" class="row"></div>
            </section>

            <section class="mt-5">
                <h3 class="title title-sm">Manage Feedback</h3>
                <div class="mb-3">
                    <label for="feedback-book-filter">Filter by Book</label>
                    <select id="feedback-book-filter" class="form-control">
                        <option value="">All Books</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="feedback-user-filter">Filter by User</label>
                    <select id="feedback-user-filter" class="form-control">
                        <option value="">All Users</option>
                    </select>
                </div>
                <div id="feedback-list" class="row"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="footer_logo col-lg-3">
                    <a href="index.html"><img src="logo.png" alt="Pages Logo"></a>
                    <div class="footer_iconBox">
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
                <div class="footer_menu col-lg-3">
                    <h5 class="title title-xs title-white">Links</h5>
                    <ul>
                        <li><a href="index.html" class="desc desc-sm desc-light">Home</a></li>
                        <li><a href="catalog.html" class="desc desc-sm desc-light">Catalog</a></li>
                        <li><a href="cart.html" class="desc desc-sm desc-light">Cart</a></li>
                        <li><a href="register.html" class="desc desc-sm desc-light">Register/Login</a></li>
                        <li><a href="feedback.html" class="desc desc-sm desc-light">Feedback</a></li>
                    </ul>
                </div>
                <div class="footer_address col-lg-3">
                    <h5 class="title title-xs title-white">Contact</h5>
                    <div>
                        <h6 class="desc desc-sm desc-light">Email:</h6>
                        <a href="mailto:support@pages.com" class="desc desc-sm desc-light">support@pages.com</a>
                    </div>
                    <div>
                        <h6 class="desc desc-sm desc-light">Phone:</h6>
                        <a href="tel:+1234567890" class="desc desc-sm desc-light">+1 234 567 890</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="admin.js"></script>
</body>
</html>
