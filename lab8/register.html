<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register/Login - Pages</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header_row row">
                <div class="header_logo col-lg-3">
                    <a href="index.html"><img src="logo.svg" alt="Pages Logo"></a>
                </div>
                <div class="header_menu col-lg-6">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="catalog.html">Catalog</a></li>
                        <li><a href="cart.html">Cart</a></li>
                        <li><a href="register.html">Register/Login</a></li>
                        <li><a href="feedback.html">Feedback</a></li>
                        <li class="admin-link" style="display: none;"><a href="admin.html">Admin</a></li>
                    </ul>
                </div>
                <div class="header_iconBox col-lg-3">
                    <a href="#"><i class="fas fa-search"></i></a>
                    <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
                    <a href="register.html"><i class="fas fa-user"></i></a>
                </div>
            </div>
        </div>
    </header>

    <main class="register">
        <div class="container">
            <h2 class="title text-center">Register or Login</h2>
            <section class="mt-5">
                <div class="row">
                    <div class="col-lg-6">
                        <h3 class="title title-sm">Register</h3>
                        <form id="register-form">
                            <div class="mb-3">
                                <label for="register-username" class="required">Username *</label>
                                <input type="text" id="register-username" class="form-control" required>
                                <span class="error"></span>
                            </div>
                            <div class="mb-3">
                                <label for="register-email" class="required">Email *</label>
                                <input type="email" id="register-email" class="form-control" required>
                                <span class="error"></span>
                            </div>
                            <div class="mb-3">
                                <label for="register-password" class="required">Password *</label>
                                <input type="password" id="register-password" class="form-control" required>
                                <span class="error"></span>
                            </div>
                            <button type="submit" id="submit-register" class="button" disabled>Register</button>
                        </form>
                    </div>
                    <div class="col-lg-6">
                        <h3 class="title title-sm">Login</h3>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-email" class="required">Email *</label>
                                <input type="email" id="login-email" class="form-control" required>
                                <span class="error"></span>
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="required">Password *</label>
                                <input type="password" id="login-password" class="form-control" required>
                                <span class="error"></span>
                            </div>
                            <button type="submit" id="submit-login" class="button" disabled>Login</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="footer_logo col-lg-3">
                    <a href="index.html"><img src="logo.svg" alt="Pages Logo"></a>
                    <div class="footer_iconBox">
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
                <div class="footer_menu col-lg-3">
                    <h5 class="title title-xs title-white">Links</h5>
                    <ul>
                        <li><a href="index.html" class="desc desc-sm desc-light">Home</a></li>
                        <li><a href="catalog.html" class="desc desc-sm desc-light">Catalog</a></li>
                        <li><a href="cart.html" class="desc desc-sm desc-light">Cart</a></li>
                        <li><a href="register.html" class="desc desc-sm desc-light">Register/Login</a></li>
                        <li><a href="feedback.html" class="desc desc-sm desc-light">Feedback</a></li>
                    </ul>
                </div>
                <div class="footer_address col-lg-3">
                    <h5 class="title title-xs title-white">Contact</h5>
                    <div>
                        <h6 class="desc desc-sm desc-light">Email:</h6>
                        <a href="mailto:support@pages.com" class="desc desc-sm desc-light">support@pages.com</a>
                    </div>
                    <div>
                        <h6 class="desc desc-sm desc-light">Phone:</h6>
                        <a href="tel:+1234567890" class="desc desc-sm desc-light">+1 234 567 890</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="register.js"></script>
</body>
</html>
